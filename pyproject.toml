[build-system]
# setuptools>=77.0.3 is the floor for the PEP 639 metadata below (SPDX `license`
# string + `license-files`): on anything older the two keys are rejected at build
# time, so the pin is what makes the license declaration enforceable.
requires = [ "setuptools>=77.0.3", "setuptools-scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "optimi_lab"
dynamic = [
    "version"
]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = ""
readme = "README.md"
# 3.13: numerics-lab's own floor; a floor below an engine's is an install that cannot resolve.
requires-python = ">=3.13"

authors = [{ name = "Mingyang Bao" }]
# numpy / scipy (R1: linalg, sparse, special only), plus lab-commons for ONE module: `lab_commons.outcomes` (standard
# library only), the task-outcome vocabulary every engine shares (plan II.1/II.3) -- no extra, never
# pinned (R8). numerics-lab is the equation-solving engine (R4): every line search, trust-region
# step, quasi-Newton update and linear/KKT solve is its. Libraries float (R8): a bare repository URL,
# no ref; a product that composes both mounts it as a component, whose path source overrides this.
# rtoml, pint, pydantic, pandas and matplotlib went with the roles that needed them; scikit-learn
# left with P10 (every surrogate is self-implemented, optimi_lab.model) and is a TEST oracle only.
dependencies = [
    "lab-commons @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/lab-commons.git",
    "numerics-lab @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/numerics-lab.git",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    # Reference oracles for the self-implemented surrogates (plan R1): tests only, never runtime.
    "scikit-learn",
    # pymoo is a TEST ORACLE only (ruling R1): tests/benchmarks compare every population method
    # against its implementation; the runtime never imports it.
    "pymoo",
    "coverage[toml]",

    'pdoc',
    'commitizen',
    "ruff",

    # The shared DEVELOPMENT kit: `dev_lab.dev.rules` authors each development rule's universal
    # statement, and `tests/architecture/test_optimi_lab_adopts_the_shared_registry.py` names which
    # of them this repo enforces and which it declares absent. DEV LAYER ONLY -- dev-lab brings
    # development dependencies; lab-commons itself is standard-library-only. This library is imported
    # BY other libraries, so the kit must not become a runtime dependency. The URL is bare: a sha or a
    # tag is a ceiling nobody re-argued, and a repo held at one stops being told when a rule moved.
    "dev-lab @ git+https://gitea.mingyangbao.site/Tianjie-Zou-Team/dev-lab.git",
]
# The `reminder` extra (resend) went with optimi_lab.utils.email_reminder: a numerics library
# does not send mail.

[project.scripts]

# dev-lab is pinned to a pushed integrate/main commit whose lab_commons imports match
# the lab-commons this lock resolves (the #35 relock moved lab-commons past 997e21a).
[tool.uv.sources]
dev-lab = { git = "https://gitea.mingyangbao.site/Tianjie-Zou-Team/dev-lab.git", rev = "840e6b748bcccd7acf3baf9cc99d9de359a06bad" }

# ===================
# Build
# ===================
[tool.setuptools_scm]
version_file = "src/optimi_lab/__version__.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["optimi_lab*"]

# ===================
# Coverage
# ===================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "if 0:",
    "if __name__ == '__main__':",
    "@not_implemented",
    "@abstractmethod"
]
omit = [
    "__version__.py",# generated by setuptools-scm
    "test_*.py",
    "tests/*",
]
[tool.coverage.html]
directory = "htmlcov"

# ===================
# Ruff
# Refer to https://docs.astral.sh/ruff/rules/
# ===================
[tool.ruff]
target-version = "py313"
line-length = 120
unsafe-fixes = true
exclude = [
    "ignore",
    "output",
    ".venv*",
    ".git",
    "**/__version__.py",
]

[tool.ruff.lint]
preview = false
select = ["AIR", "ERA", "YTT", "ANN", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "FIX", "FA", "INT", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TID", "TD", "ARG", "PTH", "FLY", "I", "C90", "NPY", "PD", "N", "PERF", "E", "W", "D", "F", "PGH", "PLC", "PLE", "PLR", "PLW", "UP", "FURB", "RUF", "TRY"]
# extend-ignore = ["CPY","DOC","FAST","TC", ]
ignore = [
    "ANN002",#Missing type annotation for
    "ANN003",#Missing type annotation for
    # "ANN101",# Missing type annotation for `cls` in method
    # "ANN102",# Missing type annotation for `cls` in classmethod
    "ANN202",#Missing return type annotation for private function
    "ARG002",# Unused method argument
    "B904",#Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "C901",#{name} is too complex ({complexity} > {max_complexity})
    "COM812",
    "D105",#Missing docstring in magic method
    "D205",#1 blank line required between summary line and description
    "D400", # First line should end with a period
    "D415", #missing-terminal-punctuation	First line should end with a period, question mark, or exclamation point
    "D417",#Missing argument description in the docstring
    "DTZ005", #`datetime.datetime.now()` called without a `tz` argument
    "E501",#line too long
    "FBT",#ruff-boolean-trap (FBT)
    "LOG015",#call on root logger
    "N801",# Class name  should use CapWords conventio
    "N802",#Function name  should be lowercase
    "N803",#Argument name should be lowercase
    "N805",#First argument of a method should be named self
    "N815",# Variable  in class scope should not be mixedCase
    "N816", # Variable `use_unit_A_phase_matrix` in global scope should not be mixedCase
    "N818",#Exception name should be named with an Error suffix
    "S101",#Use of assert detected. The enclosed code will be removed when compiling to optimised bytecode.
    "S311",# Standard pseudo-random generators are not suitable for cryptographic purposes
    "S603",#subprocess-without-shell-equals-true (S603)
    "SIM108",#Use ternary operator xxx instead of `if`-`else`-block
    "SLF001",# Private member accessed:
    "RUF012",# Mutable class attributes should be annotated with
    "RUF043", # Pattern passed to `match=` contains metacharacters but is neither escaped nor raw
    "PLR0912",#Too many branches (15 > 12)
    "PLR0913",#Too many arguments in function definition (7 > 5)
    "PLR0915",#Too many statements (51 > 50)
    "PT012",#`pytest.raises()` block should contain a single simple statement
    "PT018",#Assertion should be broken down into multiple parts
    # incompatible with the formatter
    "Q000",# Single quotes found but double quotes preferred
    "Q003",# Change outer quotes to avoid escaping inner quotes
    "UP017",# Use `datetime.UTC` alias

    # TODO: remove these ignore rules
    "ANN201",#Missing return type annotation for public function
    "ANN206",#Missing return type annotation for classmethod
    "ANN001",#Missing type annotation for function argument
    "B018",#Found useless expression. Either assign it to a variable or remove it.
    "D203",
    "D100",#Missing docstring in public module
    "D101",#Missing docstring in public class
    "D102",#Missing docstring in public method
    "D103",#Missing docstring in public function
    "D104",#Missing docstring in public package
    "D107",#Missing docstring in __init__
    "D213",# preview
    "D401",#First line should be in imperative mood
    "ERA001",#Found commented-out code
    "N806",# Variable in function should be lowercase
    "PLR2004",# Magic value used in comparison, consider replacing  with a constant variable
    "PLW2901",#loop variable  overwritten by assignment target
    "SIM113",#Use  for index variable
    "TRY300",# Consider moving this statement to an `else` block
    "NPY002",#Replace legacy `np.random.rand` call with `np.random.Generator`
    "INP001",#part of an implicit namespace package. Add an `__init__.py`.
    "TD",# TODO
    "FIX",#FIX
    "EXE",
    ]

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ===================
# Pytest
# ===================
[tool.pytest.ini_options]
filterwarnings = [
    # "error",
    "ignore::UserWarning",
]
minversion = "6.0"
markers = [
    "workstation: needs a live checkout or agent tooling (hooks, origin refs, worktrees, node)",
]
addopts = """
-v -q
-ra
-s
--cov=src --cov=scripts --cov-report html --no-cov-on-fail --cov-append
--doctest-modules --doctest-continue-on-failure
"""
testpaths = [
    "tests",
    'src',
]

# ===================
# commitizen
# ===================
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "scm"
changelog_incremental = true
update_changelog_on_bump = true

# ===================
# lab-commons branchset (ONE-BRANCH-PER-SESSION)
# ===================
[tool.lab_commons.branchset]
trunk = 'main'
sessions = ['integrate/main']
prune_merged = true

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --group dev'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.lab_commons.placement]
code_roots = ['examples/']
pruned_paths = ['.claude/worktrees', 'docs', 'htmlcov']
scratch = 'scratch/'
max_age_days = 3.0

[tool.lab_commons.parts]
output = "output/logs"

[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]
resources = ["workstation"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# on a full forge PASS. Adopted 2026-10-18 after P9/P10/P13 reached main with no trunk gate (no pre-push
# hook, no forge part): integrate/main is cut at main's tip, so every commit after it is a merge.
[tool.lab_commons.integrator]
trunk = "main"
integration = "integrate/main"
pr_merges_since = "dca72b71758ee4c70fb991fbcb44c56a9e52498d"

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) as is, its pre-push trunk gate included.
[tool.lab_commons.hooks]
